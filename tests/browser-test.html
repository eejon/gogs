<!DOCTYPE html>
<!--
  browser-test.html — Phase 2 browser test harness for custom-pdf-render.
  Usage: ?pdf=<path-to-pdf>
  Exposes window._testResult = { success, pixelCount, error }
  after rendering page 0 to a canvas.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PDF Renderer Browser Test</title>
  <style>
    body { margin: 0; background: #fff; }
    canvas { display: block; }
    #status { font-family: monospace; padding: 8px; }
  </style>
</head>
<body>
  <div id="status">Loading...</div>
  <canvas id="testCanvas"></canvas>

  <!-- Load Phase 2 modules in dependency order -->
  <script src="../public/plugins/custom-pdf-render/src/pdf-fonts.js"></script>
  <script src="../public/plugins/custom-pdf-render/src/pdf-images.js"></script>
  <script src="../public/plugins/custom-pdf-render/src/pdf-security.js"></script>
  <script src="../public/plugins/custom-pdf-render/src/pdf-parser.js"></script>
  <script src="../public/plugins/custom-pdf-render/src/pdf-renderer.js"></script>

  <script>
  (async function() {
    const statusEl = document.getElementById('status');
    const canvas   = document.getElementById('testCanvas');

    function setResult(success, pixelCount, error) {
      window._testResult = { success, pixelCount: pixelCount || 0, error: error || null };
      statusEl.textContent = 'Result: ' + JSON.stringify(window._testResult);
      console.log('[test]', JSON.stringify(window._testResult));
    }

    // Parse ?pdf= query parameter
    const params  = new URLSearchParams(window.location.search);
    const pdfPath = params.get('pdf');

    if (!pdfPath) {
      setResult(false, 0, 'No ?pdf= parameter provided');
      return;
    }

    // Fetch PDF bytes
    let arrayBuffer;
    try {
      const response = await fetch(pdfPath);
      if (!response.ok) {
        setResult(false, 0, 'HTTP error ' + response.status + ' fetching ' + pdfPath);
        return;
      }
      arrayBuffer = await response.arrayBuffer();
    } catch (e) {
      setResult(false, 0, 'Fetch error: ' + e.message);
      return;
    }

    // Parse PDF
    let parser, loadResult;
    try {
      parser     = new PDFParser(arrayBuffer);
      loadResult = await parser.load();
    } catch (e) {
      setResult(false, 0, 'Parser threw: ' + e.message);
      return;
    }

    if (loadResult.error) {
      // malformed PDF — expected failure
      setResult(false, 0, 'ParseError: ' + loadResult.error.message);
      return;
    }

    const pages = loadResult.pages;
    if (!pages || pages.length === 0) {
      setResult(false, 0, 'No pages found');
      return;
    }

    // Render page 0
    let renderError = null;
    try {
      const renderer = new PDFRenderer();
      await renderer.renderPage(canvas, pages[0], 1.0, parser);
    } catch (e) {
      renderError = e;
    }

    if (renderError) {
      setResult(false, 0, 'Render error: ' + renderError.message);
      return;
    }

    // Count non-white pixels
    let pixelCount = 0;
    try {
      const ctx       = canvas.getContext('2d');
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data      = imageData.data;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        if (r < 250 || g < 250 || b < 250) pixelCount++;
      }
    } catch (e) {
      // Canvas may be tainted — count as success if render didn't throw
      pixelCount = -1;
    }

    setResult(true, pixelCount, null);
  })();
  </script>
</body>
</html>
